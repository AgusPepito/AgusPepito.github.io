<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Off-track structures · model preview</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-columns:290px minmax(0,1fr);background:#090f19;color:#dce7ed;font:14px system-ui,sans-serif}aside{padding:26px 22px;background:#101923;border-right:1px solid #263442;overflow:auto}main{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.eyebrow{font-size:10px;letter-spacing:.15em;color:#67caec;text-transform:uppercase}h1{font-size:26px;letter-spacing:-.04em;margin:24px 0 5px}p{font-size:12px;line-height:1.65;color:#a5b6c4}#subtitle{margin:0;color:#67caec}select,button{font:inherit;background:#1a2a38;border:1px solid #3c5565;color:#e6edf2;border-radius:5px;padding:10px;cursor:pointer}select{width:100%;margin:12px 0 8px}button:hover,button:focus-visible{border-color:#6cd9ff}nav{display:flex;gap:8px;margin:22px 0}nav button{flex:1;font-size:12px}.toggle{display:flex;gap:9px;align-items:center;margin:15px 0;font-size:12px}input{accent-color:#52ceff}input[type=range]{display:block;width:100%;margin:12px 0 24px}label.distance{display:flex;justify-content:space-between;font-size:12px}section{border-top:1px solid #293845;margin-top:22px;padding-top:8px}#dimensions,#stats{font-size:11px;font-variant-numeric:tabular-nums}#error{color:#ffad8b}#notice{color:#d8bc89}.hint{position:absolute;bottom:18px;left:18px;right:18px;pointer-events:none;color:#b1c7d8;font-size:11px;text-shadow:0 1px 4px #000}a{color:#72d9ff}#reference{display:inline-block;font-size:12px;margin-top:10px}@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr)}aside{padding:12px 16px;max-height:35vh;border-right:0;border-bottom:1px solid #263442}h1{font-size:21px;margin-top:10px}aside section{display:none}nav{margin:10px 0}#description{margin:4px 0}select{max-width:320px}}
</style></head><body>
<aside><span class="eyebrow">Orbital / dressing studies</span>
<label for="asset" class="eyebrow" style="display:block;margin-top:18px">Structure</label>
<select id="asset"><option value="ring">R2 · Broken arc</option><option value="pylon">P3 · Relay crown</option><option value="boom">S3 · Service boom</option></select>
<h1 id="title">Broken arc</h1><p id="subtitle"></p><p id="description"></p><p id="dimensions"></p>
<nav aria-label="View distance"><button id="fit">Fit model</button><button id="mid">Scenery distance</button></nav>
<label class="distance" for="distance">Viewing distance <output id="distanceLabel"></output></label><input id="distance" type="range" min="30" max="2200" value="400" step="5">
<section aria-label="Display options"><label class="toggle"><input id="track" type="checkbox" checked>36 m track scale guide</label>
<label class="toggle"><input id="lights" type="checkbox" checked>Emissive lights</label><label class="toggle"><input id="bloom" type="checkbox" checked>Soft bloom</label>
<label class="toggle"><input id="space" type="checkbox" checked>Space backdrop</label><label class="toggle"><input id="rotate" type="checkbox">Slowly rotate model</label></section>
<section><p id="stats"></p><p>Standalone models for your review. Track is a scale guide; level placement is not applied.</p></section><p id="notice" role="status"></p><p id="error" role="alert"></p>
</aside><main id="viewport"><div class="hint">Drag to orbit · Wheel to zoom · Right-drag to pan</div></main>
<script type="module" src="./preview.js"></script></body></html>
